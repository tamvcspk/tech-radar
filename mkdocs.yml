site_name: Tech Radar
site_description: Tin công nghệ tổng hợp tự động mỗi ngày, kèm bài phân tích sâu.
site_url: https://tamvcspk.github.io/tech-radar/
repo_url: https://github.com/tamvcspk/tech-radar

theme:
  name: material
  language: vi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: vi

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
